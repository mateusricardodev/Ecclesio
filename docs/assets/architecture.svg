<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ecclesio technical architecture</title>
  <desc id="desc">React frontend connected to a NestJS API, PostgreSQL database and external services.</desc>
  <rect width="1200" height="300" rx="28" fill="#fff" stroke="#E9E9E9" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#0A0A09">
