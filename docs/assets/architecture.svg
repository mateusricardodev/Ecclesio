      <rect x="55" y="100" width="220" height="100" rx="18"/><rect x="350" y="100" width="220" height="100" rx="18"/>
      <rect x="645" y="100" width="220" height="100" rx="18"/><rect x="940" y="100" width="205" height="100" rx="18"/>
    </g>
    <g text-anchor="middle">
